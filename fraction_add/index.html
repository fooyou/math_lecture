<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>分数加法 - Fraction Addition</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
</head>
<body>
    <div id="container">
        <div id="leftPanel">
            <div id="canvasArea">
                <canvas id="animationCanvas"></canvas>
                <div id="title">分数加法</div>
                <div id="fracSelector">
                    <span class="fracLabel">算式:</span>
                    <button class="fracBtn active" data-n1="1" data-d1="3" data-n2="1" data-d2="6">1/3+1/6</button>
                    <button class="fracBtn" data-n1="1" data-d1="4" data-n2="1" data-d2="3">1/4+1/3</button>
                    <button class="fracBtn" data-n1="2" data-d1="5" data-n2="1" data-d2="10">2/5+1/10</button>
                </div>
            </div>
            <div id="controlsBar">
                <button id="playPauseBtn">暂停</button>
                <input type="range" id="progressSlider" min="0" max="1000" value="0">
            </div>
        </div>
        <div id="rightPanel">
            <div id="sectionTitle">扇形合并证明</div>
            <div id="formulaSection">
                <div class="formula-line" id="formulaLine1"></div>
                <div class="formula-line" id="formulaLine2"></div>
                <div class="formula-line" id="formulaLine3"></div>
            </div>
            <div id="proofSummary">
                <div class="summary-step" id="step1">
                    <span class="stepNum">①</span>
                    <span>用扇形表示 <strong>1/3</strong> 和 <strong>1/6</strong></span>
                </div>
                <div class="summary-step" id="step2">
                    <span class="stepNum">②</span>
                    <span>通分：<strong>1/3 = 2/6</strong></span>
                </div>
                <div class="summary-step" id="step3">
                    <span class="stepNum">③</span>
                    <span>合并：<strong>2/6 + 1/6 = 3/6</strong></span>
                </div>
                <div class="summary-step" id="step4">
                    <span class="stepNum">④</span>
                    <span>约分：<strong>3/6 = 1/2</strong></span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>圆锥体积 - Cone Volume</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
</head>
<body>
    <div id="container">
        <div id="leftPanel">
            <div id="canvasArea">
                <canvas id="animationCanvas"></canvas>
                <div id="title">圆锥体积</div>
            </div>
            <div id="controlsBar">
                <button id="playPauseBtn">暂停</button>
                <input type="range" id="progressSlider" min="0" max="1000" value="0">
            </div>
        </div>
        <div id="rightPanel">
            <div id="sectionTitle">倒水实验</div>
            <div id="formulaSection">
                <div class="formula-line" id="formulaLine1"></div>
                <div class="formula-line" id="formulaLine2"></div>
                <div class="formula-line" id="formulaLine3"></div>
            </div>
            <div id="proofSummary">
                <div class="summary-step" id="step1">
                    <span class="stepNum">①</span>
                    <span>圆锥和圆柱**等底等高**</span>
                </div>
                <div class="summary-step" id="step2">
                    <span class="stepNum">②</span>
                    <span>第1次倒满圆柱的 **1/3**</span>
                </div>
                <div class="summary-step" id="step3">
                    <span class="stepNum">③</span>
                    <span>第2次倒满圆柱的 **2/3**</span>
                </div>
                <div class="summary-step" id="step4">
                    <span class="stepNum">④</span>
                    <span>第3次刚好倒满 → <strong>V = ⅓Sh</strong></span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="script.js"></script>
</body>
</html>

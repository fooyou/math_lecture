<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>凑十法 - Make Ten</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
</head>
<body>
    <div id="container">
        <div id="leftPanel">
            <div id="canvasArea">
                <canvas id="animationCanvas"></canvas>
                <div id="title">凑十法</div>
                <div id="exampleSelector">
                    <span class="exLabel">算式:</span>
                    <button class="exBtn active" data-i="0">8+7</button>
                    <button class="exBtn" data-i="1">9+6</button>
                    <button class="exBtn" data-i="2">7+6</button>
                    <button class="exBtn" data-i="3">8+5</button>
                    <button class="exBtn" data-i="4">9+4</button>
                    <button class="exBtn" data-i="5">8+4</button>
                    <button class="exBtn" data-i="6">7+5</button>
                    <button class="exBtn" data-i="7">6+5</button>
                </div>
            </div>
            <div id="controlsBar">
                <button id="playPauseBtn">暂停</button>
                <input type="range" id="progressSlider" min="0" max="1000" value="0">
            </div>
        </div>
        <div id="rightPanel">
            <div id="sectionTitle">凑十法速算</div>
            <div id="formulaSection">
                <div class="formula-line" id="formulaLine1"></div>
                <div class="formula-line" id="formulaLine2"></div>
                <div class="formula-line" id="formulaLine3"></div>
                <div class="formula-line" id="formulaLine4"></div>
            </div>
            <div id="proofSummary">
                <div class="summary-step" id="step1">
                    <span class="stepNum">①</span>
                    <span>看大数，拆小数</span>
                </div>
                <div class="summary-step" id="step2">
                    <span class="stepNum">②</span>
                    <span>凑成10，加剩余数</span>
                </div>
                <div class="summary-step" id="step3">
                    <span class="stepNum">③</span>
                    <span>10 + 剩余 = 结果</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="script.js"></script>
</body>
</html>

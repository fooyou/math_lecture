<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>勾股定理 - Pythagorean Theorem</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
</head>
<body>
    <div id="container">
        <div id="leftPanel">
            <canvas id="animationCanvas"></canvas>
            <div id="title">勾股定理</div>
            <div id="tripleSelector">
                <span class="tripleLabel">a, b =</span>
                <button class="tripleBtn active" data-a="3" data-b="4">3, 4</button>
                <button class="tripleBtn" data-a="5" data-b="12">5, 12</button>
                <button class="tripleBtn" data-a="8" data-b="15">8, 15</button>
            </div>
            <div id="controls">
                <button id="playPauseBtn">暂停</button>
                <input type="range" id="progressSlider" min="0" max="1000" value="0">
            </div>
        </div>
        <div id="rightPanel">
            <div id="sectionTitle">面积拼图证明</div>
            <div id="formulaSection">
                <div class="formula-line" id="formulaLine1"></div>
                <div class="formula-line" id="formulaLine2"></div>
                <div class="formula-line" id="formulaLine3"></div>
            </div>
            <div id="proofSummary">
                <div class="summary-step" id="step1">
                    <span class="stepNum">①</span>
                    <span>将四个全等的直角三角形放入边长为 <strong>(a+b)</strong> 的大正方形中</span>
                </div>
                <div class="summary-step" id="step2">
                    <span class="stepNum">②</span>
                    <span>第一种排列 → 空白区域为正方形，面积 = <strong>c²</strong></span>
                </div>
                <div class="summary-step" id="step3">
                    <span class="stepNum">③</span>
                    <span>第二种排列 → 空白区域分为两个正方形，面积 = <strong>a² + b²</strong></span>
                </div>
                <div class="summary-step" id="step4">
                    <span class="stepNum">④</span>
                    <span>两种排列空白面积相等 → <strong>c² = a² + b²</strong></span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
